[mgr]
show_hidden = true
ratio = [1, 2, 3]
sort_by = "natural"
show_symlink = true

[preview]
wrap = "yes"
cache_dir = "~/.yazi/cache"
max_width = 1200


[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "EDITOR",	for = "unix", block = true },
	{ run = 'typora %s', orphan = true, desc = "Typora" },
]
